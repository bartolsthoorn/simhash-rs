[package]
name = "simhash"
version = "0.3.0"
edition = "2021"
authors = [
  "Bart Olsthoorn <bartolsthoorn@gmail.com>",
  "Jakub Pastuszek <jpastuszek@gmail.com>",
]
license = "MIT"
description = "Simhash algorithm for 64-bit locality-sensitive hashing and similarity calculation"
repository = "https://github.com/bartolsthoorn/simhash-rs"
homepage = "https://github.com/bartolsthoorn/simhash-rs"
keywords = ["simhash", "hash", "similarity", "hamming", "lsh"]
categories = ["algorithms", "text-processing"]
readme = "README.md"

[features]
default = ["hasher-sip"]
hasher-sip = ["siphasher"]
hasher-fnv = ["fnv"]
async-stream = ["futures"]
mutually_exclusive_features = ["hasher-sip", "hasher-fnv"]

[[bench]]
harness = false
name = "simhash"

[dependencies.futures]
version = "0.3.31"
optional = true

[dependencies.siphasher]
optional = true
version = "0.3.5"

[dependencies.fnv]
optional = true
version = "1.0.7"

[dev-dependencies]
bencher = "0.1.5"
